# Render blueprint: a Python RAG service plus a Node gateway that serves the built frontend
# and proxies /api/v1 to it (with rate limiting that protects the LLM quota).
services:
  # 1. The RAG service (FastAPI, ChromaDB, OCR)
  - type: web
    name: nyaya-rag
    env: docker
    dockerContext: .
    dockerfilePath: deployment/Dockerfile.rag
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEYS   # optional, comma-separated extra keys tried when one is rate limited
        sync: false
      - key: ALLOWED_ORIGINS  # the gateway's public URL, e.g. https://nyaya-gateway.onrender.com
        sync: false
      # Contact form: stored in Supabase with the server-side key (never exposed to the browser)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Optional email alert for new contact messages
      - key: CONTACT_NOTIFY_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  # 2. The API gateway and frontend (Node)
  - type: web
    name: nyaya-gateway
    env: docker
    dockerContext: .
    dockerfilePath: deployment/Dockerfile.gateway
    plan: free
    envVars:
      - key: RAG_SERVICE_URL
        fromService:
          name: nyaya-rag
          type: web
          property: hostport
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      # Baked into the frontend at build time (publishable key only; never the secret key)
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
