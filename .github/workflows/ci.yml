name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag_service/requirements.txt
      - run: pip install -r rag_service/requirements.txt
      - name: Unit tests (offline: no LLM, no network)
        run: python -m unittest discover -s rag_service/tests -p "test_unit_*.py"
      - name: Retrieval quality (needs the bundled vector database, no LLM)
        run: python rag_service/tests/eval_retrieval.py
