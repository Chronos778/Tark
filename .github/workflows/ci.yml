name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Lint, Typecheck, Test & Build)
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  backend:
    name: Backend (Unit Tests & Retrieval Quality)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: rag_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag_service/requirements.txt
      - name: Install Python dependencies
        run: pip install -r rag_service/requirements.txt
      - name: "Unit tests (offline: no LLM, no network)"
        run: python -m unittest discover -s rag_service/tests -p "test_unit_*.py"
      - name: Retrieval quality evaluation (evaluates bundled vector database)
        run: python rag_service/tests/eval_retrieval.py
